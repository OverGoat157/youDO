name: youdo-kr2

x-db-environment: &db-environment
  POSTGRES_DB: ${YOUDO_DB_NAME:-youdo}
  POSTGRES_USER: ${YOUDO_DB_USER:-youdo}
  POSTGRES_PASSWORD: ${YOUDO_DB_PASSWORD:?Run python3 docker/setup.py first}

services:
  db:
    image: postgres:16-alpine
    environment: *db-environment
    ports:
      - "127.0.0.1:${YOUDO_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  verify:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.verify
    environment:
      <<: *db-environment
      YOUDO_TEST_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - maven_cache:/home/app/.m2

volumes:
  postgres_data:
  maven_cache:
