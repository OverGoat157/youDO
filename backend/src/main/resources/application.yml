spring:
  application:
    name: youdo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55433/youdo_backend}
    username: ${DB_USER:youdo_backend}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
youdo:
  jwt-secret: ${JWT_SECRET}
  issuer: youdo
  access-duration: 15m
  refresh-duration: 14d
  cookie-secure: ${COOKIE_SECURE:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}
  permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
  bootstrap:
    login: ${BOOTSTRAP_ADMIN_LOGIN:}
    name: ${BOOTSTRAP_ADMIN_NAME:Администратор}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
